version: '3.8'

# Desarrollo - Ejecutar desde la raíz: docker compose -f docker-compose.dev.yml up -d --build

services:
  host-dev:
    build:
      context: .
      dockerfile: apps/host/Dockerfile.dev
    container_name: mf-host-dev
    ports:
      - "3000:3000"
    volumes:
      - ./apps/host/src:/app/apps/host/src
      - ./apps/host/public:/app/apps/host/public
      - ./packages/design-system:/app/packages/design-system
      - /app/node_modules
      - /app/apps/host/node_modules
      - /app/apps/users/node_modules
      - /app/packages/design-system/node_modules
    environment:
      - NODE_ENV=development
      - USERS_URL=http://localhost:3001
    networks:
      - mf-network

  users-dev:
    build:
      context: .
      dockerfile: apps/users/Dockerfile.dev
    container_name: mf-users-dev
    ports:
      - "3001:3001"
    volumes:
      - ./apps/users/src:/app/apps/users/src
      - ./apps/users/public:/app/apps/users/public
      - ./packages/design-system:/app/packages/design-system
      - /app/node_modules
      - /app/apps/host/node_modules
      - /app/apps/users/node_modules
      - /app/packages/design-system/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - mf-network

networks:
  mf-network:
    driver: bridge
